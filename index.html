                questions: [
                    {
                        id: "m1",
                        text: "Simplify: $3 \\times [4 \\times (7^2 - 5 \\times 6) + 2^6 \\div 8] - 11$",

                    {
                        id: "m2",
                        text: "Find the turning point of the parabola $f(x) = 2x^2 - 12x + 5$.",

                            { id: "d", text: "(-3, 59)" }

                        explanation: "x-coordinate: $x = -b/(2a) = 12/4 = 3$. Then $f(3) = 2(9) - 36 + 5 = -13$. Turning point (3, -13).\nCommon mistake: sign of x ($-b/2a$ with $b = -12$ gives $+3$).",
                        points: 3

                    {
                        id: "m3",
                        text: "Solve the inequality: $(1/3)(2 + 6t) \\ge 4(1/2 - t/4) - (1/6)(3 + 12t)$",
                        options: [
                            { id: "a", text: "$(-\\infty, 1/6]$" },
                            { id: "b", text: "$[1/6, +\\infty)$" },
                            { id: "c", text: "$[5/6, +\\infty)$" },
                            { id: "d", text: "$[-1/6, +\\infty)$" }

                        correct: "b",
                        explanation: "LHS = $2/3 + 2t$. RHS = $2 - t - 1/2 - 2t = 3/2 - 3t$.\nSo $2/3 + 2t \\ge 3/2 - 3t \\rightarrow 5t \\ge 3/2 - 2/3 = 5/6 \\rightarrow t \\ge 1/6$. The inequality sign does not flip because we divided by +5.",
                        points: 3
                    },
                    {
                        id: "m4",
                        text: "The roots of the equation $3x^2 - 10x + c = 0$ differ by 2. Find the value of c.",
                        options: [
                            { id: "a", text: "16/9" },
                            { id: "b", text: "8/3" },
                            { id: "c", text: "20/9" },
                            { id: "d", text: "16/3" }
                        ],
                        correct: "d",
                        explanation: "Let the roots be $\\alpha$ and $\\beta$. Sum $\\alpha + \\beta = 10/3$, difference $\\alpha - \\beta = 2$. Then $\\alpha = (10/3 + 2)/2 = 8/3$ and $\\beta = (10/3 - 2)/2 = 2/3$. Product $\\alpha\\beta = 16/9 = c/3$, so $c = 16/3$.",
                        points: 4
                    },
                    {
                        id: "m5",
                        text: "How much water must be added to 300 ml of a solution containing 40% acid to change the concentration of acid to 25%?",
                        options: [
                            { id: "a", text: "150 ml" },
                            { id: "b", text: "180 ml" },
                            { id: "c", text: "200 ml" },
                            { id: "d", text: "225 ml" }

                        correct: "b",
                        explanation: "Acid in the solution: $0.4 \\times 300 = 120$ ml. This must be 25% of the new total, so total = $120 / 0.25 = 480$ ml. Water to add = $480 - 300 = 180$ ml.",

                    },
                    {
                        id: "m6",
                        text: "The tenth term of an arithmetic sequence is $29/4$ and the second term is $5/4$. Find the first term.",
                        options: [
                            { id: "a", text: "1/2" },
                            { id: "b", text: "1/4" },
                            { id: "c", text: "3/4" },
                            { id: "d", text: "1" }

                        correct: "a",

                        points: 4
                    },
                    {
                        id: "m7",
                        text: "Maya is producing a scale drawing of a swimming pool. The pool's dimensions are 3 m by 8 m. On her drawing the pool measures 12 cm by 32 cm. What scale should she include in her plan?",
                        options: [
                            { id: "a", text: "1:20" },
                            { id: "b", text: "1:25" },
                            { id: "c", text: "1:30" },
                            { id: "d", text: "1:40" }

                        correct: "b",
                        explanation: "Convert to the same unit: 3 m = 300 cm. Scale = $12 : 300 = 1 : 25$ (check: $32$ cm $\\times 25 = 800$ cm = $8$ m).",
                        points: 2
                    },
                    {
                        id: "m8",
                        text: "ABCD is a rectangle with AB = 28 cm and BC = 14 cm. Semicircles are drawn with DC, BC and AD as diameters, as shown (the semicircle on DC is drawn inside the rectangle; the semicircles on BC and AD are outside). Find the area of the shaded region. Take $\\pi = 22/7$.\n<img src=\"q8.png\" alt=\"Diagram\" class=\"my-4 max-w-full rounded shadow-sm\">",

                            { id: "a", text: "154 cm²" },
                            { id: "b", text: "238 cm²" },
                            { id: "c", text: "308 cm²" },
                            { id: "d", text: "266 cm²" }
                        ],
                        correct: "b",
                        explanation: "Rectangle: $28 \\times 14 = 392$. Inner semicircle (diameter 28, r = 14): $1/2 \\times (22/7) \\times 14^2 = 308$. Two outer semicircles (diameter 14, r = 7) together make one full circle: $(22/7) \\times 7^2 = 154$.\nShaded = $392 - 308 + 154 = 238$ cm².",
                        points: 5
                    },
                    {
                        id: "m9",
                        text: "Find the area of a parallelogram with vertices at (-5, -3), (-2, 5), (4, 5) and (1, -3).",

                    {
                        id: "m10",
                        text: "x is inversely proportional to the square root of y. When x = 2, y = 64. What is the value of y when x = 256?",

                            { id: "d", text: "$2^{-8}$" }

                    },
                    {
                        id: "m11",
                        text: "Rearrange to make x the subject: $(5x + 3)/(2x - 1) = 4y^2 + 1$",

                    },

                        id: "m12",

                            { id: "c", text: "810 cm³" },
                            { id: "d", text: "900 cm³" }

                        points: 4
                    },
                    {
                        id: "m13",
                        text: "Q is 8 km from P on a bearing of 040°. R is 8 km from Q on a bearing of 130°. What is the bearing of P from R?",

                            { id: "a", text: "265°" },

                            { id: "c", text: "085°" },
                            { id: "d", text: "225°" }

                        points: 5
                    },
                    {

                        text: "PQR is an isosceles triangle with PQ = PR = 7 cm and QR = 10 cm. What is the value of tan of angle PQR?",

                    {

                        text: "OABC is a trapezium with OC parallel to AB. OA = 6a, AB = 4b and OC = 12b. Point E is the midpoint of AC. Write the vector BE in terms of a and b.\n<img src=\"q15.png\" alt=\"Diagram\" class=\"my-4 max-w-full rounded shadow-sm\">",

                    {

                        text: "A city football club collected money for charity during a year. The total was divided among three charities A, B and C in the ratio 1 : 2/3 : 5/6. Charity C received £2 500. What was the total amount collected?",

                        text: "The cross-section of a triangular prism is an equilateral triangle with side $4x$ cm. The length of the prism is $d$ cm. The total surface area of the prism is $T$ cm², and the volume of the prism is $T$ cm³. Which expression gives $d$ in terms of $x$?",

                    {
                        id: "m22",

                    {
                        id: "m23",
                        text: "The equation $x(ax - 6) - 2x^2 + 3 = 0$ has no real roots. What is the smallest possible integer value of a?",

                        explanation: "Expand: $(a - 2)x^2 - 6x + 3 = 0$. No real roots $\\rightarrow D < 0$: $36 - 12(a - 2) < 0 \\rightarrow 60 - 12a < 0 \\rightarrow a > 5$. Smallest integer: 6.",

                    },
                    {
                        id: "m24",
                        text: "In the formula $P = r^2t/8$, $r = 4 \\times 10^{-3}$ and $t = 2.5 \\times 10^4$. Calculate P. Leave your answer in standard form.",

                        correct: "d",
                        explanation: "$r^2 = 16 \\times 10^{-6}$. $r^2t = 16 \\times 2.5 \\times 10^{-6+4} = 40 \\times 10^{-2} = 0.4$. $P = 0.4/8 = 0.05 = 5 \\times 10^{-2}$.",

                    },
                    {
                        id: "m25",
                        text: "In triangle PQR, $\\angle P = 2x°$ and $\\angle Q = (x + 5)°$. The side PR is extended to a point S, and $\\angle QRS = y°$. In terms of x, y is given by",
                        options: [
                            { id: "a", text: "3x" },

                        points: 2
                    },
                    {
                        id: "m27",
                        text: "In a group of five friends, the sums of the ages of each group of four of them are 72, 75, 78, 80 and 83. What is the age of the youngest friend?",
                        options: [
                            { id: "a", text: "12" },

                            { id: "c", text: "14" },
                            { id: "d", text: "15" }

                        correct: "c",
                        explanation: "Adding all five sums counts each friend 4 times: $72 + 75 + 78 + 80 + 83 = 388$, so the total of all ages = $388/4 = 97$. The group of four with the largest sum (83) excludes the youngest friend, so youngest = $97 - 83 = 14$.",
                        points: 5
                    },
                    {
                        id: "m28",
                        text: "Evaluate: $(-2/3)^{-2} \\times (3/2)^3 \\div (9/4)^2$",

                        explanation: "$(-2/3)^{-2} = (-3/2)^2 = 9/4$. $(3/2)^3 = 27/8$. Product = $243/32$. $(9/4)^2 = 81/16$. Division: $243/32 \\times 16/81 = 3/2$.",
                        points: 4
                    },
                    {
                        id: "m29",
                        text: "The value of $\\sqrt{37 - 12\\sqrt{7}}$ is equivalent to",
                        options: [

                    }
                ]
            },
            ct: {

                        points: 1
                    }
                ]
            }
        };

        // ==========================================
        // ЛОГИКА ПРИЛОЖЕНИЯ
        // ==========================================
        let state = {
            view: 'home', // 'home', 'exam', 'results'
            subject: null,
            currentIndex: 0,
            answers: {},
            timeLeft: 0,
            timerId: null
        };

        const app = document.getElementById('app');

        function renderMath() {
            if (window.renderMathInElement) {
                window.renderMathInElement(app, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        function renderHome() {
            app.innerHTML = `
                <div class="max-w-4xl mx-auto p-8 w-full">
                    <h1 class="text-4xl font-bold text-navy mb-2">NUET MOCK TEST</h1>
                    <p class="text-cobalt text-xl mb-10">Practice. Improve. Succeed.</p>
                    
                    <div class="grid md:grid-cols-2 gap-8">
                        <div class="bg-white p-6 rounded-2xl shadow-lg border-t-4 border-navy flex flex-col">
                            <h2 class="text-2xl font-bold text-navy mb-4">Mathematics</h2>
                            <p class="text-gray-600 mb-6 flex-grow">Evaluate your problem-solving skills. No calculators allowed.</p>
                            <button onclick="startExam('math')" class="bg-navy text-white py-3 rounded-lg hover:bg-cobalt transition font-bold">Start Math Test</button>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-lg border-t-4 border-cobalt flex flex-col">
                            <h2 class="text-2xl font-bold text-cobalt mb-4">Critical Thinking</h2>
                            <p class="text-gray-600 mb-6 flex-grow">Analyze arguments, find flaws, and identify assumptions.</p>
                            <button onclick="startExam('ct')" class="bg-cobalt text-white py-3 rounded-lg hover:bg-navy transition font-bold">Start CT Test</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function startExam(subject) {
            state.subject = subject;
            state.view = 'exam';
            state.currentIndex = 0;
            state.answers = {};
            state.timeLeft = examData[subject].duration * 60;
            
            clearInterval(state.timerId);
            state.timerId = setInterval(() => {
                state.timeLeft--;
                if (state.timeLeft <= 0) {
                    submitExam();
                } else {
                    document.getElementById('timer-display').innerText = formatTime(state.timeLeft);
                }
            }, 1000);

            renderExam();
        }

        function selectAnswer(qId, aId) {
            state.answers[qId] = aId;
            renderExam(); // Перерисовываем, чтобы показать выбранный вариант
        }

        function renderExam() {
            const data = examData[state.subject];
            const q = data.questions[state.currentIndex];
            const answeredCount = Object.keys(state.answers).length;

            let optionsHtml = q.options.map(opt => {
                const isSelected = state.answers[q.id] === opt.id;
                return `
                    <button onclick="selectAnswer('${q.id}', '${opt.id}')" 
                        class="w-full text-left p-4 rounded-lg border-2 transition ${isSelected ? 'border-cobalt bg-blue-50' : 'border-gray-200 hover:border-gray-300'}">
                        <span class="font-bold mr-3 uppercase">${opt.id}.</span> ${opt.text}
                    </button>
                `;
            }).join('');

            let navHtml = data.questions.map((_, idx) => {
                const hasAnswer = state.answers[data.questions[idx].id];
                const isCurrent = idx === state.currentIndex;
                return `
                    <button onclick="state.currentIndex = ${idx}; renderExam();" 
                        class="p-2 rounded font-semibold text-sm ${isCurrent ? 'ring-2 ring-cobalt' : ''} ${hasAnswer ? 'bg-cobalt text-white' : 'bg-gray-100 text-gray-600'}">
                        ${idx + 1}
                    </button>
                `;
            }).join('');

            app.innerHTML = `
                <div class="bg-navy text-white p-4 flex justify-between items-center shadow-md">
                    <div class="font-bold text-lg">${data.title} Exam</div>
                    <div class="flex items-center gap-4">
                        <div id="timer-display" class="font-mono text-xl">${formatTime(state.timeLeft)}</div>
                        <button onclick="if(confirm('Submit your test?')) submitExam();" class="bg-white text-navy px-4 py-1 rounded-md font-bold hover:bg-gray-200">Submit</button>
                    </div>
                </div>

                <div class="flex-grow max-w-5xl mx-auto w-full p-4 flex flex-col md:flex-row gap-6 mt-6">
                    <div class="md:w-3/4 bg-white p-8 rounded-xl shadow-sm border border-gray-100">
                        <h2 class="text-xl font-bold text-navy mb-4">Question ${state.currentIndex + 1} of ${data.questions.length}</h2>
                        <div class="text-lg mb-8 whitespace-pre-wrap">${q.text}</div>
                        <div class="space-y-3">${optionsHtml}</div>
                        
                        <div class="flex justify-between mt-10">
                            <button onclick="if(state.currentIndex > 0) { state.currentIndex--; renderExam(); }" class="font-bold text-cobalt ${state.currentIndex === 0 ? 'opacity-50 cursor-not-allowed' : ''}">Previous</button>
                            <button onclick="if(state.currentIndex < ${data.questions.length - 1}) { state.currentIndex++; renderExam(); }" class="font-bold text-cobalt ${state.currentIndex === data.questions.length - 1 ? 'opacity-50 cursor-not-allowed' : ''}">Next</button>
                        </div>
                    </div>

                    <div class="md:w-1/4 bg-white p-4 rounded-xl shadow-sm border border-gray-100 h-fit">
                        <h3 class="font-bold text-navy mb-3">Progress: ${answeredCount}/${data.questions.length}</h3>
                        <div class="grid grid-cols-5 gap-2">${navHtml}</div>
                    </div>
                </div>
            `;
            setTimeout(renderMath, 0);
        }

        function submitExam() {
            clearInterval(state.timerId);
            state.view = 'results';
            renderResults();
        }

        function renderResults() {
            const data = examData[state.subject];
            let score = 0;
            let totalPoints = 0;

            let reviewHtml = data.questions.map((q, idx) => {
                totalPoints += q.points;
                const isCorrect = state.answers[q.id] === q.correct;
                if (isCorrect) score += q.points;

                const myAnswer = q.options.find(o => o.id === state.answers[q.id]);
                const correctOption = q.options.find(o => o.id === q.correct);

                return `
                    <div class="p-6 rounded-xl border-l-4 mb-6 ${isCorrect ? 'border-green-500 bg-green-50' : 'border-red-500 bg-red-50'}">
                        <h4 class="font-bold text-lg mb-4">Question ${idx + 1} ${isCorrect ? '✅' : '❌'}</h4>
                        <div class="mb-4 whitespace-pre-wrap">${q.text}</div>
                        <div class="mb-2"><strong>Your answer:</strong> ${myAnswer ? myAnswer.text : '<i>Not answered</i>'}</div>
                        ${!isCorrect ? `<div class="mb-4 text-green-700"><strong>Correct answer:</strong> ${correctOption.text}</div>` : ''}
                        <div class="mt-4 p-4 bg-white rounded-lg border border-gray-200">
                            <p class="font-bold text-sm text-cobalt mb-1">EXPLANATION:</p>
                            <p class="text-sm whitespace-pre-wrap">${q.explanation}</p>
                        </div>
                    </div>
                `;
            }).join('');

            const percentage = Math.round((score / totalPoints) * 100);

            app.innerHTML = `
                <div class="max-w-4xl mx-auto bg-white p-8 rounded-2xl shadow-lg mt-8 mb-8 border-t-8 border-navy">
                    <h1 class="text-3xl font-bold text-navy mb-6">Test Results: ${data.title}</h1>
                    <div class="flex items-center gap-8 mb-10 p-6 bg-blue-50 rounded-xl">
                        <div class="text-6xl font-bold text-cobalt">${percentage}%</div>
                        <div>
                            <p class="text-lg">Points: <strong>${score} / ${totalPoints}</strong></p>
                            <p class="text-lg">Answered: <strong>${Object.keys(state.answers).length} / ${data.questions.length}</strong></p>
                        </div>
                    </div>
                    <h3 class="text-2xl font-bold text-navy mb-6">Detailed Review</h3>
                    <div>${reviewHtml}</div>
                    <button onclick="state.view = 'home'; renderHome();" class="mt-8 bg-navy text-white px-6 py-3 rounded-lg font-bold hover:bg-cobalt">Back to Home</button>
                </div>
            `;
            setTimeout(renderMath, 0);
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // Запуск
        renderHome();
    </script>
</body>
</html>
